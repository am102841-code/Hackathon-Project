<!DOCTYPE html>
<html>
<head>
    <title>RecycleRight</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>RecycleRight</h1>

    <div class="position-test">
        <h2>Test Position</h2>
    </div>

    <br>

    <p class="description">Helping people dispose of waste properly.</p>
    <p class="description">Find the right way to dispose of your waste.</p>

    <div class="button-container">
        <input class="item-input" type="text" placeholder="Enter an item">

        <button class="scan-button">Scan an Item</button>

        <button class="location-button">Find a Recycling Location</button>
    </div>

    <div class="camera-container">
        <video class="camera" autoplay></video>

        <canvas class="snapshot" width="400" height="300"></canvas>
    </div>

    <button class="photo-button">Take Photo</button>

    <button class="retake-button">Retake Photo</button>

    <button class="analyze-button">Analyze Photo</button>


    <div class="results-card">
        <h2 class="results-title">Analysis Results</h2>

        <p class="results-status"></p>

        <p class="results-message"></p>
    </div>


    <script src="script.js"></script>

</body>
</html>
